{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1 class="hero-title">{{ site_name }}</h1>
  <p class="hero-tagline">{{ tagline }}</p>
</section>

<ul class="article-grid">
  {% for a in articles %}
  <li class="article-card">
    <a href="articles/{{ a.slug }}.html">
      <div class="article-card-media">
        <img src="images/{{ a.slug }}.png" alt="{{ a.title }}" loading="lazy">
        <span class="badge" style="background:{{ a.genre_color or '#374151' }}">{{ a.genre_label }}{% if a.type == "product" %} ・ PR{% endif %}</span>
      </div>
      <div class="article-card-body">
        <p class="article-card-title">{{ a.title }}</p>
        <p class="article-card-excerpt">{{ a.meta_description }}</p>
        <p class="article-card-date">{{ a.published_at[:10] }}</p>
      </div>
    </a>
  </li>
  {% endfor %}
</ul>
{% endblock %}
